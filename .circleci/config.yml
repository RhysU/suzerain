# See https://circleci.com/docs/2.0/reusing-config/
version: 2.1

jobs:
  deploy-docs:
    docker:
      - image: cimg/base:current-24.04
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Doxygen and Graphviz
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y doxygen graphviz
      - run:
          name: Build Doxygen documentation
          command: |
            PROJECT=suzerain \
            VERSION=$(grep AC_INIT configure.ac | cut -d, -f2 | tr -d '[] ') \
            DOCDIR=docs \
            SRCDIR=. \
            GENERATE_HTML=YES \
            GENERATE_LATEX=NO \
            GENERATE_RTF=NO \
            GENERATE_MAN=NO \
            GENERATE_XML=NO \
            GENERATE_CHI=NO \
            HAVE_DOT=YES \
            DOT_PATH="" \
            doxygen doxygen.cfg
      - run:
          name: Deploy to gh-pages
          command: |
            if [ "${CIRCLE_BRANCH}" = "master" ]; then
              echo "Deploying documentation to gh-pages..."
              ./.circleci/deploy-ghpages.sh docs/html
            else
              echo "Not master (current: ${CIRCLE_BRANCH}), skipping deployment"
            fi

workflows:
  deploy-docs:
    jobs:
      - deploy-docs
